<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Botluyo - Topluyo Bot Blok Kodlama</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/blockly_compressed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/blocks_compressed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/javascript_compressed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/msg/tr.js"></script>
</head><body>
<header>🤖 Botluyo<small>Topluyo bot blok kodlama</small></header>
<main>
<section id="work"><div id="tabs"></div><div id="ws"></div></section>
<aside id="side">
<button id="export" class="big">📦 Botu Hazırla</button>
<div id="tree"></div><pre id="code"></pre>
</aside>
</main>
<dialog id="dlg">
<h3>Botunu hazırla</h3>
<button id="dl">💾 Derlenmiş dosyaları indir (.zip)</button>
<label>🔑 Bot tokeninizi buraya giriniz<input id="tok" type="password" autocomplete="off" placeholder="Token"></label>
<button id="dlt">🔑 Tokenli indir</button>
<button id="cls">Kapat</button>
<p class="hint">Token sadece indirilen .token.json dosyasına yazılır, hiçbir yere gönderilmez. Token "Cihazlarım" bölümünden alınır; bot hesabının adı "bot" ile başlamalı ya da bitmeli.</p>
</dialog>
<div id="toast"></div>
<script src="api.js"></script><script src="app.js"></script>
</body></html>
